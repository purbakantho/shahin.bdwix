<div class="contact-container">
  <div class="form-header">
    <div class="logo-circle">
       <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh2LknzHx1jledPoj-GyooihJxOmjZBVopUxSqN6CUexD2AlO-tMjdTWR9bROPkwqxQaTjCFX05GnCLJVmTslqUTp1UlTR3Eyzde5OeCDN6NukqasDODS-hCB-HP2t-sC-YzQZXICx9TfvNfPkURfXxg0ZkVDehPz4QqNuQWIZam8RgOeIPSUx0xqHbbPnl/s1600/Shahin-logo.png" alt="Shafiqul Alam Shahin">
    </div>
    
    <a href="https://shahin.bdwix.com/" target="_blank" style="text-decoration: none;">
      <h3 class="animated-text">যোগাযোগ করুন</h3>
    </a>
  </div>

  <form action="https://formsubmit.co/shahinpurbadhala@gmail.com" method="POST" enctype="multipart/form-data" class="custom-form">
    
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_success" value="https://shahinpurbadhala.blogspot.com/p/thanks.html">

    <div class="input-group">
      <label>আপনার নাম</label>
      <input type="text" name="name" placeholder="আপনার নাম লিখুন" required>
    </div>

    <div class="input-group">
      <label>ইমেইল এড্রেস</label>
      <input type="email" name="email" placeholder="আপনার ইমেইল" required>
    </div>

    <div class="input-group">
      <label>ফাইল আপলোড (ঐচ্ছিক)</label>
      <input type="file" name="attachments" accept="image/*, audio/*, .pdf, .doc, .docx" multiple>
      <small class="help-text">সর্বোচ্চ ৫ মেগাবাইটের ৩টি ফাইল পাঠানো যাবে।</small>
    </div>

    <div class="input-group">
      <label>আপনার বার্তা</label>
      <textarea name="message" rows="4" placeholder="এখানে আপনার বার্তা লিখুন..." required></textarea>
    </div>

    <button type="submit" class="submit-btn">বার্তা পাঠান</button>
  </form>
</div>

<style>
  :root {
    --bg-dark: #0f172a; 
    --gold: #d4af37;    
    --white: #ffffff;
  }

  .contact-container {
    max-width: 450px;
    margin: 30px auto;
    background: var(--white);
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
    border: 1px solid #ddd;
  }

  .form-header {
    background-color: var(--bg-dark);
    padding: 35px 20px;
    text-align: center;
    border-bottom: 4px solid var(--gold);
  }

  /* গোলাকার ছবির ডিজাইন */
  .logo-circle {
    width: 100px;
    height: 100px;
    background: #fff;
    border: 3px solid var(--gold);
    border-radius: 50%;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .logo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* গোল্ডেন শাইন অ্যানিমেশন */
  .animated-text {
    font-size: 26px;
    font-weight: 800;
    margin: 0;
    background: linear-gradient(90deg, #fff 0%, #d4af37 50%, #fff 100%);
    background-size: 200% auto;
    color: #fff;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: goldShine 3s linear infinite;
  }

  @keyframes goldShine {
    to { background-position: 200% center; }
  }

  /* Form Fields Styling */
  .custom-form { padding: 30px; }
  .input-group { margin-bottom: 20px; }
  .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
  .input-group input, .input-group textarea {
    width: 100%; padding: 12px; border: 1.5px solid #eee; border-radius: 10px; font-size: 14px;
  }
  .input-group input:focus { border-color: var(--gold); outline: none; }

  /* Submit Button */
  .submit-btn {
    width: 100%; padding: 15px; background: var(--bg-dark); color: var(--gold);
    border: 2px solid var(--gold); border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px;
  }
  .submit-btn:hover { background: var(--gold); color: #fff; }
</style>
