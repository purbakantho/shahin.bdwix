<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form - Shafiqul Alam Shahin</title>
  <style>
    :root { 
      --bg-dark: #0f172a; 
      --gold: #d4af37; 
      --white: #ffffff; 
      --whatsapp: #25d366; 
    }

    * { box-sizing: border-box; }

    body { 
      margin: 0; 
      padding: 15px; 
      background-color: #f1f5f9; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh;
    }

    .contact-container { 
      width: 100%; 
      max-width: 450px; 
      background: var(--white); 
      border-radius: 20px; 
      box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
      font-family: 'Segoe UI', Tahoma, sans-serif; 
      overflow: hidden; 
      border: 1px solid #ddd; 
    }

    .form-header { 
      background-color: var(--bg-dark); 
      padding: 30px 20px; 
      text-align: center; 
      border-bottom: 4px solid var(--gold); 
    }

    .logo-circle { 
      width: 100px; 
      height: 100px; 
      background: #fff; 
      border: 3px solid var(--gold); 
      border-radius: 50%; 
      margin: 0 auto 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden; 
    }

    .logo-circle img { width: 100%; height: 100%; object-fit: cover; }

    /* আপনার নাম স্টাইল */
    .user-name {
      color: var(--white);
      font-size: 18px;
      font-weight: 600;
      margin: 5px 0 10px;
      letter-spacing: 0.5px;
    }

    .animated-text { 
      font-size: 24px; 
      font-weight: 800; 
      background: linear-gradient(90deg, #fff 0%, #d4af37 50%, #fff 100%); 
      background-size: 200% auto; 
      color: #fff; 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      animation: goldShine 3s linear infinite; 
      margin-top: 5px;
    }

    @keyframes goldShine { to { background-position: 200% center; } }

    .custom-form { padding: 25px; }

    .input-group { margin-bottom: 18px; text-align: left; }

    .input-group label { 
      display: block; 
      margin-bottom: 8px; 
      font-weight: 600; 
      color: #333; 
      font-size: 14px;
    }

    .input-group input, 
    .input-group textarea { 
      width: 100%; 
      padding: 12px; 
      border: 1.5px solid #eee; 
      border-radius: 10px; 
      font-size: 16px; /* মোবাইলে টাইপিং সুবিধার জন্য */
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus, 
    .input-group textarea:focus {
      border-color: var(--gold);
    }

    .help-text { display: block; margin-top: 5px; color: #666; font-size: 11px; }

    .submit-btn { 
      width: 100%; 
      padding: 14px; 
      background: var(--bg-dark); 
      color: var(--gold); 
      border: 2px solid var(--gold); 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 16px; 
      margin-bottom: 12px; 
      transition: 0.3s;
    }

    .submit-btn:hover {
      background: var(--gold);
      color: var(--bg-dark);
    }

    .whatsapp-btn { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      width: 100%; 
      padding: 14px; 
      background: var(--whatsapp); 
      color: white; 
      text-decoration: none; 
      border-radius: 10px; 
      font-weight: bold; 
      font-size: 16px; 
    }

    /* মোবাইল ডিভাইসের জন্য বাড়তি সতর্কতা */
    @media (max-width: 480px) {
      body { padding: 10px; }
      .form-header { padding: 20px 15px; }
      .logo-circle { width: 85px; height: 85px; }
      .user-name { font-size: 16px; }
      .animated-text { font-size: 20px; }
      .custom-form { padding: 20px 15px; }
    }
  </style>
</head>
<body>

<div class="contact-container">

</div>

</body>
</html>
