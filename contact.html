<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contact Form</title>
  <style>
    :root { --bg-dark: #0f172a; --gold: #d4af37; --white: #ffffff; --whatsapp: #25d366; }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { 
      background-color: #f1f5f9; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      height: 100vh; /* পুরো স্ক্রিন দখল করবে */
      font-family: 'Segoe UI', Tahoma, sans-serif;
      overflow: hidden; /* স্ক্রল বন্ধ করার জন্য */
    }

    .contact-container { 
      width: 95%; 
      max-width: 400px; 
      background: var(--white); 
      border-radius: 15px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
      border: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    .form-header { 
      background-color: var(--bg-dark); 
      padding: 15px 10px; 
      text-align: center; 
      border-bottom: 3px solid var(--gold); 
    }

    .logo-circle { 
      width: 60px; /* লোগো ছোট করা হয়েছে */
      height: 60px; 
      background: #fff; 
      border: 2px solid var(--gold); 
      border-radius: 50%; 
      margin: 0 auto 5px; 
      display: flex; align-items: center; justify-content: center; 
      overflow: hidden; 
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: cover; }

    .user-name { color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 2px; }

    .animated-text { 
      font-size: 18px; 
      font-weight: 800; 
      background: linear-gradient(90deg, #fff 0%, #d4af37 50%, #fff 100%); 
      background-size: 200% auto; 
      color: #fff; 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      animation: goldShine 3s linear infinite; 
    }

    @keyframes goldShine { to { background-position: 200% center; } }

    .custom-form { padding: 15px; }

    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; margin-bottom: 4px; font-weight: 600; color: #333; font-size: 12px; }

    .input-group input, .input-group textarea { 
      width: 100%; 
      padding: 8px 12px; 
      border: 1.5px solid #eee; 
      border-radius: 8px; 
      font-size: 14px; 
      outline: none;
    }

    .help-text { font-size: 10px; color: #777; margin-top: 2px; }

    .submit-btn { 
      width: 100%; 
      padding: 10px; 
      background: var(--bg-dark); 
      color: var(--gold); 
      border: 2px solid var(--gold); 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 14px; 
      margin-bottom: 8px; 
    }

    .whatsapp-btn { 
      display: flex; align-items: center; justify-content: center; 
      width: 100%; padding: 10px; 
      background: var(--whatsapp); 
      color: white; text-decoration: none; 
      border-radius: 8px; font-weight: bold; font-size: 14px; 
    }

    /* স্ক্রিন সাইজ অনুযায়ী ছোট করা */
    @media (max-height: 600px) {
      .logo-circle { width: 45px; height: 45px; }
      .animated-text { font-size: 16px; }
      .custom-form { padding: 10px; }
      .input-group { margin-bottom: 5px; }
      textarea { rows: 2 !important; height: 60px; }
    }
  </style>
</head>
<body>

<div class="contact-container">
  <div class="form-header">
    <div class="logo-circle">
      <a href="https://shahin.bdwix.com/" target="_blank">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh2LknzHx1jledPoj-GyooihJxOmjZBVopUxSqN6CUexD2AlO-tMjdTWR9bROPkwqxQaTjCFX05GnCLJVmTslqUTp1UlTR3Eyzde5OeCDN6NukqasDODS-hCB-HP2t-sC-YzQZXICx9TfvNfPkURfXxg0ZkVDehPz4QqNuQWIZam8RgOeIPSUx0xqHbbPnl/s1600/Shahin-logo.png" alt="Shafiqul Alam Shahin">
      </a>
    </div>
    <div class="user-name">Shafiqul Alam Shahin</div>
    <h3 class="animated-text">যোগাযোগ করুন</h3>
  </div>

  <form action="https://formsubmit.co/shahinpurbadhala@gmail.com" method="POST" enctype="multipart/form-data" class="custom-form">
    <input type="hidden" name="_captcha" value="false">
    
    <div class="input-group">
      <label>আপনার নাম</label>
      <input type="text" name="name" placeholder="নাম লিখুন" required>
    </div>

    <div class="input-group">
      <label>ইমেইল এড্রেস</label>
      <input type="email" name="email" placeholder="ইমেইল লিখুন" required>
    </div>

    <div class="input-group">
      <label>ফাইল (ঐচ্ছিক)</label>
      <input type="file" name="attachments" accept="image/*,.pdf">
      <small class="help-text">সর্বোচ্চ ৫ মেগাবাইট</small>
    </div>

    <div class="input-group">
      <label>আপনার বার্তা</label>
      <textarea name="message" rows="3" placeholder="বার্তা লিখুন..." required></textarea>
    </div>

    <button type="submit" class="submit-btn">বার্তা পাঠান</button>
    
    <a href="https://wa.me/8801711796839" target="_blank" class="whatsapp-btn">
      WhatsApp এ কথা বলুন
    </a>
  </form>
</div>

</body>
</html>
