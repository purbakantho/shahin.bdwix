<div class="contact-container">
  <div class="form-header">
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEihG3Y6..." alt="Shafiqul Alam Shahin" style="width: 100%; border-radius: 8px 8px 0 0;">
    <h3>যোগাযোগ করুন</h3>
  </div>

  <form action="https://formsubmit.co/shahinpurbadhala@gmail.com" method="POST" enctype="multipart/form-data" class="custom-form">
    
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_success" value="https://shahinpurbadhala.blogspot.com/p/thanks.html">

    <div class="input-group">
      <label>আপনার নাম</label>
      <input type="text" name="name" placeholder="আপনার নাম লিখুন" required>
    </div>

    <div class="input-group">
      <label>ইমেইল এড্রেস</label>
      <input type="email" name="email" placeholder="আপনার ইমেইল" required>
    </div>

    <div class="input-group">
      <label>ফাইল আপলোড (ঐচ্ছিক)</label>
      <input type="file" name="attachments" accept="image/*, audio/*, .pdf, .doc, .docx" multiple>
      <small class="help-text">Ctrl চেপে ধরে একসাথে ৩টি ফাইল সিলেক্ট করতে পারবেন (সর্বোচ্চ ৫ মেগাবাইট)।</small>
    </div>

    <div class="input-group">
      <label>আপনার বার্তা</label>
      <textarea name="message" rows="4" placeholder="এখানে আপনার বার্তা লিখুন..." required></textarea>
    </div>

    <button type="submit" class="submit-btn">বার্তা পাঠান</button>
  </form>
</div>

<style>
  /* Match the dark navy from your banner */
  :root {
    --primary-dark: #1a252f; 
    --accent-gold: #b39359;
    --text-light: #f4f4f4;
  }

  .contact-container {
    max-width: 450px;
    margin: 20px auto;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    border: 1px solid #eee;
  }

  .form-header {
    background-color: var(--primary-dark);
    padding: 20px;
    text-align: center;
    color: white;
  }

  .form-header h3 {
    margin-top: 15px;
    margin-bottom: 0;
    font-size: 22px;
    color: var(--accent-gold);
  }

  .custom-form {
    padding: 25px;
  }

  .input-group {
    margin-bottom: 18px;
  }

  .input-group label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-size: 14px;
    font-weight: 600;
  }

  .input-group input, 
  .input-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 14px;
    transition: border 0.3s ease;
  }

  .input-group input:focus, 
  .input-group textarea:focus {
    outline: none;
    border-color: var(--accent-gold);
    box-shadow: 0 0 5px rgba(179, 147, 89, 0.3);
  }

  .help-text {
    color: #777;
    font-size: 11px;
    display: block;
    margin-top: 5px;
    line-height: 1.4;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background-color: var(--primary-dark);
    color: var(--accent-gold);
    border: 2px solid var(--accent-gold);
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .submit-btn:hover {
    background-color: var(--accent-gold);
    color: white;
  }

  /* Responsive adjustment */
  @media (max-width: 480px) {
    .contact-container {
      margin: 10px;
    }
  }
</style>
