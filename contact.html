<div class="contact-container">
  <div class="form-header">
    <div class="logo-circle">
       <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh68-J25j9u5LzYyE6Z6L5qW6l5z5f6G7H8I9J0K1L2M3N4O5P6Q7R8S9T0/s1600/FINALshahin.jpg" alt="Shafiqul Alam Shahin">
    </div>
    <h3 class="animated-text">যোগাযোগ করুন</h3>
  </div>

  <form action="https://formsubmit.co/shahinpurbadhala@gmail.com" method="POST" enctype="multipart/form-data" class="custom-form">
    
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_success" value="https://shahinpurbadhala.blogspot.com/p/thanks.html">

    <div class="input-group">
      <label>আপনার নাম</label>
      <input type="text" name="name" placeholder="আপনার নাম লিখুন" required>
    </div>

    <div class="input-group">
      <label>ইমেইল এড্রেস</label>
      <input type="email" name="email" placeholder="আপনার ইমেইল" required>
    </div>

    <div class="input-group">
      <label>ফাইল আপলোড (প্রয়োজন হলে)</label>
      <input type="file" name="attachments" accept="image/*, audio/*, .pdf, .doc, .docx" multiple>
      <small class="help-text">Ctrl চেপে ধরে একসাথে ৩টি ফাইল সিলেক্ট করতে পারবেন (সর্বোচ্চ ৫ মেগাবাইট)।</small>
    </div>

    <div class="input-group">
      <label>আপনার বার্তা</label>
      <textarea name="message" rows="4" placeholder="এখানে আপনার বার্তা লিখুন..." required></textarea>
    </div>

    <button type="submit" class="submit-btn">বার্তা পাঠান</button>
  </form>
</div>

<style>
  /* Color Palette matching your Banner */
  :root {
    --bg-dark: #0f172a; /* Dark Navy from banner */
    --gold: #c5a059;    /* Gold from logo */
    --white: #ffffff;
  }

  .contact-container {
    max-width: 450px;
    margin: 30px auto;
    background: var(--white);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    border: 1px solid #ddd;
  }

  /* Header Section */
  .form-header {
    background-color: var(--bg-dark);
    padding: 30px 20px;
    text-align: center;
    position: relative;
  }

  .logo-circle {
    width: 90px;
    height: 90px;
    background: var(--bg-dark);
    border: 3px solid var(--gold);
    border-radius: 50%;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 0 15px rgba(197, 160, 89, 0.4);
  }

  .logo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Text Animation */
  .animated-text {
    font-size: 24px;
    font-weight: bold;
    margin: 0;
    background: linear-gradient(to right, #ffffff 20%, #c5a059 40%, #c5a059 60%, #ffffff 80%);
    background-size: 200% auto;
    color: #fff;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }

  @keyframes shine {
    to {
      background-position: 200% center;
    }
  }

  /* Form Fields Styling */
  .custom-form {
    padding: 30px;
  }

  .input-group {
    margin-bottom: 20px;
  }

  .input-group label {
    display: block;
    margin-bottom: 8px;
    color: #444;
    font-size: 14px;
    font-weight: 600;
  }

  .input-group input, 
  .input-group textarea {
    width: 100%;
    padding: 12px;
    border: 1.5px solid #eee;
    border-radius: 10px;
    background: #f9f9f9;
    font-size: 14px;
    transition: all 0.3s ease;
  }

  .input-group input:focus, 
  .input-group textarea:focus {
    outline: none;
    border-color: var(--gold);
    background: #fff;
    box-shadow: 0 0 8px rgba(197, 160, 89, 0.2);
  }

  .help-text {
    color: #888;
    font-size: 11px;
    margin-top: 6px;
    display: block;
  }

  /* Submit Button */
  .submit-btn {
    width: 100%;
    padding: 15px;
    background: var(--bg-dark);
    color: var(--gold);
    border: 2px solid var(--gold);
    border-radius: 10px;
    cursor: pointer;
    font-size: 17px;
    font-weight: bold;
    transition: 0.4s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .submit-btn:hover {
    background: var(--gold);
    color: var(--bg-dark);
    box-shadow: 0 5px 15px rgba(197, 160, 89, 0.4);
    transform: translateY(-2px);
  }

  @media (max-width: 480px) {
    .contact-container {
      margin: 15px;
    }
  }
</style>
